<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mount Kosciuszko Trip Expenses</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--text:#1d2a22;--muted:#6a7a70;--accent:#2f6b4f;--line:#e3e8e4}
@media (prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1b2620;--text:#e8f0ea;--muted:#93a69a;--accent:#4aa878;--line:#2a3830}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.hero{position:relative;height:260px;background:#000 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0) 65%)}
.hero div{position:absolute;left:16px;right:16px;bottom:16px;z-index:1;color:#fff;max-width:560px;margin:0 auto}
.hero h1{margin:0;font-size:1.7rem}
.hero p{margin:4px 0 0;opacity:.9}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 32px}
.card{background:var(--card);border-radius:16px;padding:8px 16px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.name{font-weight:600}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.total{background:var(--accent);color:#fff;border-radius:16px;padding:16px;margin-top:16px;display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700}
.pay{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:18px;margin-top:16px;text-align:center}
.pay .lbl{color:var(--muted);font-size:.9rem}
.pay .each{font-size:2.2rem;font-weight:800;color:var(--accent);margin:2px 0}
.pay .id{font-size:1.4rem;font-weight:700;letter-spacing:.5px;margin:8px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer}
h2{font-size:1.1rem;margin:28px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;color:#fff;font-size:.8rem;background:linear-gradient(transparent,rgba(0,0,0,.65))}
figure:first-child{grid-column:span 2;aspect-ratio:16/9}
</style>
</head>

<script>
const PEOPLE = 11;
const expenses = [
  ["Car rental", 669.79],
  ["ZamZam (Meat)", 81.62],
  ["Woolworths", 376.06],
  ["Fuel", 34.88],
  ["Kosciuszko National Park Fee", 340],
  ["Carpark Canberra", 7],
  ["Manakamana Grocery", 127.98],
  ["Fruitopia", 11.97],
  ["Coles", 35]
];
const money = n => "$" + n.toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
const total = expenses.reduce((s,e)=>s+e[1],0);
document.getElementById("list").innerHTML = expenses.map(e=>`<div class="row"><div class="name">${e[0]}</div><div class="amt">${money(e[1])}</div></div>`).join("");
document.getElementById("total").textContent = money(total);
document.getElementById("each").textContent = money(Math.ceil(total/PEOPLE*100)/100);
document.getElementById("copy").onclick = function(){
  const t="0416508475", b=this;
  const done=()=>{b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy PayID",1800)};
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,done)}else{done()}
};
</script>
